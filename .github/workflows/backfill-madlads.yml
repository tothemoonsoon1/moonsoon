name: Backfill Mad Lads Sales

on:
  schedule:
    # Every three hours until the whole collection is covered. The work is
    # ~24 hours of walking at the free plan's 9 requests/second, so eight
    # chunks a day finish it in a bit over a day. Each chunk stops after
    # 145 minutes, which leaves the daily snapshot a gap to run in (the two
    # share a concurrency group so they never push at once). Once the
    # backfill is done these runs exit in seconds; drop the schedule back to
    # daily then.
    - cron: '12 */3 * * *'
  push:
    branches: [claude/bold-thompson-jy7fuk]
    paths: ['scripts/backfill-madlads-sales.mjs', '.github/workflows/backfill-madlads.yml']
  workflow_dispatch:
    inputs:
      budget:
        description: 'Helius credits to spend in this run'
        default: '200000'
      minutes:
        description: 'Minutes to spend in this run'
        default: '145'
      stage2:
        description: 'Stage 2: carry Lads stopped at the cut-off on to the mint'
        type: boolean
        default: false
      check:
        description: 'Read-only accuracy check against the Skulls data'
        type: boolean
        default: false

permissions:
  contents: write

# Shares a group with the daily snapshot so the two never push at once.
concurrency:
  group: update-madlads
  cancel-in-progress: false

env:
  CHECK: ${{ inputs.check && '1' || '' }}
  TARGET: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backfill sales
        id: backfill
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          # A push to the working branch runs a small batch.
          BUDGET: ${{ inputs.budget || (github.event_name == 'push' && '4000' || '200000') }}
          TIME_LIMIT_MIN: ${{ inputs.minutes || (github.event_name == 'push' && '10' || '145') }}
          # Lads walked at once, and the request ceiling they share. Keep RPS
          # under the Helius plan's limit (free: 10/s).
          WORKERS: '3'
          RPS: '9'
          # Stage 2 (~60 credits a Lad, ~545k in total): off until the Helius
          # credits reset (owner's decision, 14 Nov 2026). To run it on schedule,
          # use: (inputs.stage2 || github.event_name == 'schedule') && '1' || '0'
          STAGE2: ${{ inputs.stage2 && '1' || '0' }}
        run: node scripts/backfill-madlads-sales.mjs

      - name: Commit and push if changed
        if: ${{ env.CHECK != '1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add madlads-*.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: Mad Lads sales backfill [automated]"
          git pull --rebase origin "$TARGET"
          git push origin "HEAD:$TARGET"


      - name: Coverage
        if: ${{ always() && env.CHECK != '1' }}
        run: |
          node -e 'const s=require("./madlads-backfill.json");
            const pct=(s.next/s.total*100).toFixed(1);
            console.log(`${s.next}/${s.total} Lads (${pct}%), ${s.total-s.next} to go, ${s.sales} sales, ${s.credits} credits spent in total`);' >> "$GITHUB_STEP_SUMMARY"
