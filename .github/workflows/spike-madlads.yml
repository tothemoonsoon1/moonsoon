name: Spike Mad Lads data (read-only)

on:
  push:
    branches: [claude/tender-hopper-p8opwh]
    paths: ['scripts/spike-madlads.mjs', '.github/workflows/spike-madlads.yml']
  workflow_dispatch:
    inputs:
      sample_random:
        description: 'Random mints to fully read'
        default: '50'
      sample_skulls:
        description: 'Skulls to check the sale parser against'
        default: '30'

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run spike
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SAMPLE_RANDOM: ${{ inputs.sample_random || '50' }}
          SAMPLE_SKULLS: ${{ inputs.sample_skulls || '30' }}
        run: node scripts/spike-madlads.mjs
